# Per-client API rate limit. This file is rendered by the nginx container
# at startup so BACKEND_HOST can differ between local Docker and Railway.
limit_req_zone $binary_remote_addr zone=repolens_api:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Reject oversized multipart bodies before they reach FastAPI.
    # The application itself also enforces a 25 MiB compressed ZIP limit.
    client_max_body_size 26m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Browser-facing security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    error_page 413 = @upload_too_large;
    error_page 429 = @rate_limited;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=repolens_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://${BACKEND_HOST}/;
        proxy_http_version 1.1;
        proxy_request_buffering on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 25s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"Upload exceeds the reverse-proxy size limit."}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please wait and try again."}';
    }
}
